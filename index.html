<!doctype html>
<meta charset="utf-8">
<button onclick="getSession()">获取 sessionId</button>
<pre id="result"></pre>

<script>
  function getSession() {
    const sessionId = window.wdobject.shellreq('{"operate":"getsessionid"}');
    document.getElementById('result').textContent = sessionId || 'none';
  }
</script>
