<!doctype html>
<meta charset="utf-8">
<button onclick="getSession()">获取 sessionId</button>
<pre id="result"></pre>

<script>
  function getSession() {
    const result = document.getElementById('result');

    if (!window.wdobject || typeof window.wdobject.shellreq !== 'function') {
      result.textContent = '没有检测到 session：wdobject.shellreq 未注入';
      return;
    }

    const sessionId = window.wdobject.shellreq('{"operate":"getsessionid"}');

    result.textContent = sessionId
      ? sessionId
      : '没有检测到 session';
  }
</script>
